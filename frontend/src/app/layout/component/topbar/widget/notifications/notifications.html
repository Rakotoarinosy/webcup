<div class="relative inline-block">
    <!-- Bouton cloche utilisant la classe Sakai et p-badge -->
    <button type="button" class="layout-topbar-action relative" (click)="togglePanel($event)">
        <i class="pi pi-bell"></i>
        <span>Notifications</span>
        <!-- Utilisation directe du composant p-badge de PrimeNG -->
        <p-badge *ngIf="unreadCount > 0" [value]="unreadCount.toString()" severity="danger"
            styleClass="absolute top-[-2px] right-[-2px]" />
    </button>

    <!-- Panneau déroulant des notifications -->
    <div *ngIf="showPanel"
        class="absolute right-0 mt-3 w-80 bg-surface-0 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-xl shadow-xl z-50 overflow-hidden">

        <!-- En-tête -->
        <div
            class="flex items-center justify-between px-4 py-3 border-b border-surface-200 dark:border-surface-700 bg-surface-50 dark:bg-surface-800">
            <span class="font-semibold text-surface-900 dark:text-surface-0 text-sm">Notifications</span>
            <button *ngIf="unreadCount > 0" (click)="markAllAsRead()"
                class="text-xs text-primary hover:underline font-medium">
                Tout marquer comme lu
            </button>
        </div>

        <!-- Liste -->
        <div class="max-h-80 overflow-y-auto divide-y divide-surface-100 dark:divide-surface-800">
            <div *ngFor="let notif of notifications" (click)="markAsRead(notif)"
                [class]="'p-3 cursor-pointer transition-colors flex gap-3 items-start ' + (notif.read ? 'opacity-60 bg-transparent' : 'bg-primary-50/40 dark:bg-primary-400/5 hover:bg-surface-50 dark:hover:bg-surface-800')">

                <!-- Icône -->
                <div
                    [class]="'flex items-center justify-center w-8 h-8 rounded-full shrink-0 ' + getIconStyle(notif.type)">
                    <i [class]="'pi ' + notif.icon"></i>
                </div>

                <!-- Texte -->
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-surface-900 dark:text-surface-0 truncate">{{ notif.title }}</p>
                    <p class="text-xs text-muted-color mt-0.5">{{ notif.time }}</p>
                </div>

                <!-- Point non lu -->
                <div *ngIf="!notif.read" class="w-2 h-2 rounded-full bg-primary shrink-0 self-center"></div>
            </div>

            <div *ngIf="notifications.length === 0" class="p-6 text-center text-muted-color text-sm">
                Aucune notification
            </div>
        </div>
    </div>
</div>
