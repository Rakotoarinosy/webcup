<div class="layout-topbar">
    <!-- Menu toggle & logo -->
    <div class="layout-topbar-logo-container">
        <button class="layout-menu-button layout-topbar-action" (click)="layoutService.onMenuToggle()">
            <i class="pi pi-bars"></i>
        </button>
        <a class="layout-topbar-logo" routerLink="/">
            <span class="grid size-9 place-items-center rounded-xl bg-primary text-white" aria-hidden="true">K</span>
            <span>Kotrana</span>
        </a>
    </div>

    <!-- Actions -->
    <div class="layout-topbar-actions">
        @if (user(); as profile) {
            <a routerLink="/home/account" class="mr-3 grid max-w-40 gap-0.5 text-sm" data-testid="session-identity">
                <strong class="truncate">{{ profile.name }}</strong>
                <span class="text-xs text-muted-color">Connecté · {{ roleLabel() }}</span>
            </a>
        }
        <!-- Theme settings -->
        <div class="layout-config-menu">
            <app-theme-switcher variant="topbar" />
            <div class="relative">
                <button type="button" aria-label="Affichage et taille du texte" class="layout-topbar-action layout-topbar-action-highlight" pStyleClass="@next" enterFromClass="hidden" enterActiveClass="animate-scalein" leaveToClass="hidden" leaveActiveClass="animate-fadeout" [hideOnOutsideClick]="true">
                    <i class="pi pi-palette"></i>
                </button>
                <app-configurator />
            </div>
        </div>

        <!-- Mobile menu toggle -->
        <button class="layout-topbar-menu-button layout-topbar-action" pStyleClass="@next" enterFromClass="hidden" enterActiveClass="animate-scalein" leaveToClass="hidden" leaveActiveClass="animate-fadeout" [hideOnOutsideClick]="true">
            <i class="pi pi-ellipsis-v"></i>
        </button>

        <!-- Topbar menu -->
        <div class="layout-topbar-menu hidden lg:block">
            <div class="layout-topbar-menu-content">
                <app-notifications />

                <button type="button" class="layout-topbar-action" [attr.aria-label]="'Compte : ' + (user()?.name ?? '')" (click)="menu.toggle($event)">
                    <i class="pi pi-user"></i>
                    <span>{{ user()?.name ?? 'Compte' }}</span>
                </button>
                <p-menu #menu [model]="items()" [popup]="true" appendTo="body" />
            </div>
        </div>
    </div>
</div>
