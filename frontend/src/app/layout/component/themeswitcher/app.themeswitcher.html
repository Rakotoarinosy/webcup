@if (variant() === 'topbar') {
    <button type="button" class="layout-topbar-action" [pTooltip]="'Thème : ' + current().label" tooltipPosition="bottom" aria-haspopup="true" [attr.aria-label]="'Thème : ' + current().label" (click)="menu.toggle($event)">
        <i [class]="current().icon"></i>
    </button>
} @else {
    <p-button type="button" [rounded]="true" [icon]="current().icon" severity="secondary" [ariaLabel]="'Thème : ' + current().label" (onClick)="menu.toggle($event)" />
}

<p-menu #menu [model]="items()" [popup]="true" appendTo="body">
    <ng-template #item let-item>
        <a class="p-menu-item-link flex items-center gap-2" [class.font-semibold]="item.state?.active" [attr.aria-checked]="item.state?.active" role="menuitemradio">
            <i [class]="item.icon"></i>
            <span class="flex-1">{{ item.label }}</span>
            @if (item.state?.active) {
                <i class="pi pi-check text-primary"></i>
            }
        </a>
    </ng-template>
</p-menu>
