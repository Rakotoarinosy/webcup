<p-toast />

<div class="card">
    <!-- Toolbar -->
    <p-toolbar styleClass="mb-6">
        <ng-template #start>
            <p-button label="Nouvel utilisateur" icon="pi pi-plus" (onClick)="openNew()" />
        </ng-template>

        <ng-template #end>
            <p-button icon="pi pi-refresh" severity="secondary" [text]="true" [loading]="loading()" (onClick)="loadUsers()" ariaLabel="Recharger" />
        </ng-template>
    </p-toolbar>

    <!-- Users table -->
    <p-table #dt [value]="users()" [loading]="loading()" [rows]="10" [paginator]="users().length > 10" [globalFilterFields]="['name', 'email']" [rowHover]="true" dataKey="id">
        <ng-template #caption>
            <div class="flex items-center justify-between">
                <div>
                    <h5 class="m-0">Utilisateurs</h5>
                    <span class="text-muted-color text-sm">Données servies par le backend : GET /api/v1/users</span>
                </div>
                <p-iconfield>
                    <p-inputicon styleClass="pi pi-search" />
                    <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Rechercher..." />
                </p-iconfield>
            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th pSortableColumn="name">Nom <p-sortIcon field="name" /></th>
                <th pSortableColumn="email">Email <p-sortIcon field="email" /></th>
                <th pSortableColumn="created_at">Créé le <p-sortIcon field="created_at" /></th>
                <th style="width: 8rem"></th>
            </tr>
        </ng-template>

        <ng-template #body let-user>
            <tr>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.created_at | date: 'dd/MM/yyyy HH:mm' }}</td>
                <td class="text-right">
                    <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" class="mr-2" (onClick)="openEdit(user)" ariaLabel="Modifier" />
                    <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (onClick)="confirmDelete(user)" ariaLabel="Supprimer" />
                </td>
            </tr>
        </ng-template>

        <ng-template #emptymessage>
            <tr>
                <td colspan="4" class="text-center py-8 text-muted-color">Aucun utilisateur. Cliquez sur « Nouvel utilisateur » pour en créer un.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<!-- Create / edit dialog -->
<p-dialog [(visible)]="dialogVisible" [header]="editedUser() ? 'Modifier l\'utilisateur' : 'Nouvel utilisateur'" [modal]="true" [style]="{ width: '28rem' }">
    <form #userForm="ngForm" id="userForm" class="flex flex-col gap-6" (ngSubmit)="save()">
        <div>
            <label for="name" class="block font-bold mb-3">Nom</label>
            <input pInputText id="name" name="name" [(ngModel)]="form.name" required maxlength="255" class="w-full" autofocus />
        </div>
        <div>
            <label for="email" class="block font-bold mb-3">Email</label>
            <input pInputText id="email" name="email" type="email" [(ngModel)]="form.email" required email class="w-full" />
        </div>
    </form>

    <ng-template #footer>
        <!-- Boutons natifs : `form="userForm"` soumet le formulaire depuis le pied du dialog. -->
        <button pButton type="button" label="Annuler" icon="pi pi-times" [text]="true" (click)="dialogVisible.set(false)"></button>
        <button pButton type="submit" form="userForm" label="Enregistrer" icon="pi pi-check" [loading]="saving()" [disabled]="!userForm.valid || saving()"></button>
    </ng-template>
</p-dialog>

<!-- Delete confirmation -->
<p-confirmdialog [style]="{ width: '28rem' }" />
