<div class="col-span-12 lg:col-span-6 xl:col-span-3">
    <a class="card mb-0 block cursor-pointer no-underline transition-transform hover:-translate-y-0.5 hover:shadow-md focus-visible:outline-2 focus-visible:outline-primary" [routerLink]="links()[0]">
        <div class="flex justify-between mb-4">
            <div>
                <span class="block text-muted-color font-medium mb-4">Demandes ouvertes</span>
                <div class="text-surface-900 dark:text-surface-0 font-medium text-xl">{{ stats().openRequests }}</div>
            </div>
            <div class="flex items-center justify-center bg-blue-100 dark:bg-blue-400/10 rounded-border"
                style="width: 2.5rem; height: 2.5rem">
                <i class="pi pi-folder-open text-blue-500 !text-xl"></i>
            </div>
        </div>
        <span class="text-primary font-medium">En attente de prise en charge</span>
    </a>
</div>

<div class="col-span-12 lg:col-span-6 xl:col-span-3">

            <div>
                <span class="block text-muted-color font-medium mb-4">Demandes en cours</span>
                <div class="text-surface-900 dark:text-surface-0 font-medium text-xl">{{ stats().inProgressRequests }}
                </div>
            </div>
            <div class="flex items-center justify-center bg-orange-100 dark:bg-orange-400/10 rounded-border"
                style="width: 2.5rem; height: 2.5rem">
                <i class="pi pi-clock text-orange-500 !text-xl"></i>
            </div>
        </div>
        <span class="text-orange-500 font-medium">Traitement en cours</span>
    </a>
</div>

        </div>
