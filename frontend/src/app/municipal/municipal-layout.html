<a class="skip-link" href="#main-content" (click)="skipToContent($event)">Aller au contenu principal</a>
<header>
    <div class="header-row">
        <a class="brand" routerLink="/" aria-label="Terra Nova, accueil">Terra Nova</a>
        <nav aria-label="Services municipaux">
            <a routerLink="/municipal" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Accueil municipal</a>
            <a routerLink="/municipal/services" routerLinkActive="active" ariaCurrentWhenActive="page">Services</a>
            <a routerLink="/municipal/publications" routerLinkActive="active" ariaCurrentWhenActive="page">Publications</a>
            <a routerLink="/municipal/transports" routerLinkActive="active" ariaCurrentWhenActive="page">Transports</a>
            <a routerLink="/municipal/contact" routerLinkActive="active" ariaCurrentWhenActive="page">Contacter la mairie</a>
            <a routerLink="/municipal/lexique" routerLinkActive="active" ariaCurrentWhenActive="page">Lexique</a>
            <a class="emergency-link" routerLink="/municipal/urgences" routerLinkActive="active" ariaCurrentWhenActive="page"><i class="pi pi-heart-fill" aria-hidden="true"></i> Urgences et santé</a>
        </nav>
        @if (auth.user(); as user) {
            <a class="account" [routerLink]="auth.homeUrl()">{{ user.name }} · Mon espace</a>
        } @else {
            <a class="account" routerLink="/auth/login">Se connecter</a>
        }
    </div>
    <div class="header-row" style="justify-content: flex-end; margin-top: 0.5rem"><app-font-size /></div>
</header>
<main id="main-content" tabindex="-1"><router-outlet /></main>
