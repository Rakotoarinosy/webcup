<section class="contact-page"><p class="eyebrow">Nous contacter</p><h1>Écrivez aux services municipaux</h1><p class="intro">Votre message est transmis à l'équipe concernée. Un accusé de réception vous sera remis immédiatement.</p>@if (receipt(); as receipt) { <p-message severity="success">{{ receipt.message }} Référence : <strong>{{ receipt.receipt_number }}</strong>.</p-message> } @if (error(); as error) { <p-message severity="error">{{ error }}</p-message> }<p-card><form #contactForm="ngForm" (ngSubmit)="send(contactForm)"><div class="form-grid"><div><label for="name">Nom</label><input pInputText id="name" name="sender_name" [(ngModel)]="form.sender_name" required minlength="2"></div><div><label for="email">E-mail</label><input pInputText id="email" type="email" name="sender_email" [(ngModel)]="form.sender_email" required email></div></div><label for="service">Service concerné (facultatif)</label><p-select inputId="service" name="service_id" [(ngModel)]="form.service_id" [options]="services()" optionLabel="name" optionValue="id" placeholder="Choisir un service" [showClear]="true"></p-select><label for="subject">Objet</label><input pInputText id="subject" name="subject" [(ngModel)]="form.subject" required minlength="3"><label for="message">Message</label><textarea pTextarea id="message" name="message" [(ngModel)]="form.message" required minlength="10" rows="7"></textarea><button pButton type="submit" label="Envoyer le message" icon="pi pi-send" [loading]="sending()" [disabled]="contactForm.invalid"></button></form></p-card></section>
