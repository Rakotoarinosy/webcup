<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <title>Sakai - PrimeNG</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://primefaces.org" />
        <link rel="icon" type="image/x-icon" href="https://primefaces.org/cdn/primeng/images/favicon.png" />
        <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet" />
        <script>
            // Applique le thème mémorisé avant le démarrage d'Angular (évite le flash clair au refresh).
            // Même clé et mêmes règles que LayoutService (src/app/layout/service/layout.service.ts).
            (function () {
                var mode = 'system';
                try {
                    mode = localStorage.getItem('theme-mode') || 'system';
                } catch (e) {}
                var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) {
                    document.documentElement.classList.add('app-dark');
                }
            })();
        </script>
        <script>
            // Same key and allowed values as FontScaleService; applied before first paint.
            (function () {
                try {
                    var scale = Number(localStorage.getItem('font-scale'));
                    if ([1, 1.15, 1.3, 1.5, 2].indexOf(scale) !== -1) {
                        document.documentElement.style.setProperty('--font-scale', String(scale));
                        document.documentElement.dataset.fontScale = String(scale);
                    }
                } catch (e) {}
            })();
        </script>
    </head>

    <body>
        <app-root></app-root>
    </body>
</html>
