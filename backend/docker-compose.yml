services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    # Le projet est monté dans le conteneur : hot reload, et ./app.db partagé avec le dev local.
    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    # Décommenter avec le service db ci-dessous pour utiliser PostgreSQL :
    # environment:
    #   DATABASE_URL: postgresql+psycopg://webcup:webcup@db:5432/webcup
